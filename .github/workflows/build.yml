name: Build site
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          # A lockfile can be added after the first successful install.
          cache-dependency-path: package.json
      - run: npm install
      - run: npm run build
